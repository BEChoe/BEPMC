<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전 Q&A 문의 | BEPMC (Project Management Consultancy)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

  <div id="global-alert-banner"></div>
  <div id="global-header"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
    
    <!-- 타이틀 -->
    <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3.5 h-3.5 rounded bg-blue-600"></span>
          <h1 class="text-2xl font-black text-slate-900 tracking-tight">BEPMC 안전 관리자 Q&A 문의함</h1>
        </div>
        <p class="text-xs text-slate-600 mt-1">
          산업안전 기준, 현장 위험요소 자문, 안전설비 지원 등 BEPMC 관리자에게 직접 질의하실 수 있습니다.
        </p>
      </div>

      <div>
        <button onclick="toggleQnaForm()" class="btn-safety-yellow px-4 py-2 rounded-md text-xs font-bold shadow-sm flex items-center gap-1.5">
          <span>✉</span> 관리자에게 문의하기
        </button>
      </div>
    </div>

    <!-- 문의 작성 폼 (토글) -->
    <div id="qna-form-box" class="hidden bg-white rounded-lg shadow-sm border-2 border-blue-400 p-6 mb-8">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
          <span class="text-blue-600 font-bold">●</span> BEPMC 관리자 1:1 Q&A 문의 접수
        </h3>
        <button onclick="toggleQnaForm()" class="text-xs text-slate-400 hover:text-slate-700">닫기 ✕</button>
      </div>

      <form onsubmit="submitQna(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">문의자 성명 / 담당자</label>
            <input type="text" id="qna-author" required placeholder="홍길동" class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">답변 회신용 이메일</label>
            <input type="email" id="qna-email" required placeholder="safety@example.com" class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">문의 제목</label>
          <input type="text" id="qna-title" required placeholder="문의하실 내용의 핵심 제목을 입력하세요." class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">문의 내용</label>
          <textarea id="qna-content" rows="5" required placeholder="안전관리 현안, 법적 기준, 현장 애로사항을 상세히 적어주시면 BEPMC 관리자가 확인 후 답변드립니다." class="w-full text-xs p-3 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500"></textarea>
        </div>

        <div class="flex items-center justify-between pt-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="qna-is-secret" checked class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span class="text-xs font-semibold text-slate-700">🔒 비밀글로 작성 (작성자와 관리자만 확인 가능)</span>
          </label>
          <button type="submit" class="btn-safety-black px-5 py-2 rounded text-xs font-bold shadow-sm">
            문의 접수하기
          </button>
        </div>
      </form>
    </div>

    <!-- Q&A 목록 안내 -->
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <span>📋</span> 접수된 Q&A 목록
        </span>
        <span id="admin-notice" class="text-xs font-semibold text-blue-700 hidden">
          👑 관리자 모드: 모든 Q&A 문의 수신 및 답변 권한 활성화됨
        </span>
      </div>

      <div id="qna-table-container">
        <!-- 동적 로드 -->
      </div>
    </div>

  </main>

  <div id="global-footer"></div>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initLayout('qna');

      if (currentAuth.mode === 'admin') {
        document.getElementById('admin-notice').classList.remove('hidden');
      }

      // 로그인된 사용자 정보 자동 입력
      if (currentAuth.isLoggedIn && currentAuth.user) {
        document.getElementById('qna-author').value = currentAuth.user.name;
        document.getElementById('qna-email').value = currentAuth.user.email || '';
      }

      await loadQnaList();
    });

    function toggleQnaForm() {
      const box = document.getElementById('qna-form-box');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        box.scrollIntoView({ behavior: 'smooth' });
      }
    }

    async function loadQnaList() {
      const container = document.getElementById('qna-table-container');
      container.innerHTML = `<div class="p-12 text-center text-xs text-slate-400">Q&A 목록을 불러오는 중...</div>`;

      try {
        const res = await fetch('/api/qna');
        const data = await res.json();

        if (!data.success) {
          container.innerHTML = `<div class="p-8 text-center text-xs text-red-500">${data.message}</div>`;
          return;
        }

        const list = data.qnaList;
        if (list.length === 0) {
          container.innerHTML = `<div class="p-12 text-center text-xs text-slate-400">등록된 Q&A 문의가 없습니다.</div>`;
          return;
        }

        let tableHtml = `
          <table class="w-full text-left text-xs text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-bold border-b border-slate-200">
              <tr>
                <th scope="col" class="px-4 py-3 text-center w-16">번호</th>
                <th scope="col" class="px-4 py-3 text-center w-24">상태</th>
                <th scope="col" class="px-4 py-3">문의 제목</th>
                <th scope="col" class="px-4 py-3 text-center w-28">문의자</th>
                <th scope="col" class="px-4 py-3 text-center w-28">등록일</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
        `;

        list.forEach(q => {
          const isAnswered = q.status === 'answered';
          const statusBadge = isAnswered
            ? `<span class="badge-green text-[10px] px-2 py-0.5 rounded font-bold">답변완료</span>`
            : `<span class="badge-yellow text-[10px] px-2 py-0.5 rounded font-bold">답변대기</span>`;

          tableHtml += `
            <tr class="hover:bg-slate-50 transition cursor-pointer" onclick="location.href='/qna-detail.html?id=${q.id}'">
              <td class="px-4 py-3.5 text-center text-slate-400 font-mono">${q.id}</td>
              <td class="px-4 py-3.5 text-center">${statusBadge}</td>
              <td class="px-4 py-3.5">
                <div class="flex items-center gap-1.5">
                  ${q.isSecret ? '<span class="text-slate-400">🔒</span>' : ''}
                  <a href="/qna-detail.html?id=${q.id}" class="text-xs font-semibold text-slate-900 hover:text-blue-600">
                    ${escapeHtml(q.title)}
                  </a>
                  ${q.isMine ? '<span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 rounded">내 문의</span>' : ''}
                </div>
              </td>
              <td class="px-4 py-3.5 text-center text-slate-700 font-medium">${escapeHtml(q.authorName)}</td>
              <td class="px-4 py-3.5 text-center text-slate-400 text-[11px]">${q.createdAt.split(' ')[0]}</td>
            </tr>
          `;
        });

        tableHtml += `</tbody></table>`;
        container.innerHTML = tableHtml;

      } catch (err) {
        container.innerHTML = `<div class="p-8 text-center text-xs text-red-500">목록을 불러오지 못했습니다.</div>`;
      }
    }

    async function submitQna(e) {
      e.preventDefault();
      const authorName = document.getElementById('qna-author').value.trim();
      const email = document.getElementById('qna-email').value.trim();
      const title = document.getElementById('qna-title').value.trim();
      const content = document.getElementById('qna-content').value.trim();
      const isSecret = document.getElementById('qna-is-secret').checked;

      try {
        const res = await fetch('/api/qna', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ authorName, email, title, content, isSecret })
        });
        const result = await res.json();
        if (result.success) {
          alert('BEPMC 관리자에게 Q&A 문의가 성공적으로 접수되었습니다.');
          document.getElementById('qna-title').value = '';
          document.getElementById('qna-content').value = '';
          toggleQnaForm();
          await loadQnaList();
        } else {
          alert(result.message || '접수에 실패했습니다.');
        }
      } catch (err) {
        alert('오류가 발생했습니다: ' + err.message);
      }
    }
  </script>
</body>
</html>
