<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 신청 | BEPMC (Project Management Consultancy)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

  <div id="global-alert-banner"></div>
  <div id="global-header"></div>

  <main class="max-w-md mx-auto px-4 py-12 w-full flex-1 flex flex-col justify-center">

    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <!-- 헤더 -->
      <div class="bg-[#0f172a] p-6 text-center text-white border-b-2 border-blue-600">
        <h1 class="text-lg font-bold text-white">BEPMC 회원가입 신청</h1>
        <p class="text-xs text-amber-300 mt-1">※ 안전포털은 관리자 승인 후 정식 회원이 됩니다.</p>
      </div>

      <!-- 안내 배너 -->
      <div class="p-4 bg-blue-50 border-b border-blue-100 text-xs text-blue-950 leading-relaxed">
        <span class="font-bold text-blue-800">📋 가입 절차 안내:</span><br>
        1. 가입 양식 제출 &rarr; 2. BEPMC 관리자 가입 자격 승인 &rarr; 3. 회원 전용 게시판 및 토론 권한 부여
      </div>

      <!-- 폼 -->
      <form onsubmit="handleRegister(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">아이디 (ID)</label>
          <input type="text" id="reg-username" required placeholder="영문 또는 숫자 4자 이상" class="w-full text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">비밀번호</label>
          <input type="password" id="reg-password" required placeholder="비밀번호 입력" class="w-full text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">성명 / 현장 담당자명</label>
          <input type="text" id="reg-name" required placeholder="홍길동" class="w-full text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">이메일 (승인 결과 안내용)</label>
          <input type="email" id="reg-email" required placeholder="safety@company.com" class="w-full text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full btn-safety-green py-3 rounded-lg text-xs font-bold tracking-wide shadow-sm hover:bg-emerald-700 transition">
            가입 신청서 제출하기
          </button>
        </div>

        <div class="text-center pt-2 text-xs">
          <a href="/login.html" class="text-slate-500 hover:text-slate-900">이미 계정이 있으신가요? 로그인하기 &rarr;</a>
        </div>
      </form>
    </div>

  </main>

  <div id="global-footer"></div>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initLayout();
    });

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, name, email })
        });
        const result = await res.json();

        if (result.success) {
          alert(result.message);
          location.href = '/login.html';
        } else {
          alert(result.message || '가입 신청에 실패했습니다.');
        }
      } catch (err) {
        alert('오류가 발생했습니다: ' + err.message);
      }
    }
  </script>
</body>
</html>
