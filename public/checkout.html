<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 및 결제 | BEPMC 안전몰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

  <div id="global-alert-banner"></div>
  <div id="global-header"></div>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-10 w-full flex-1">
    
    <div class="mb-6">
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">안전용품 주문서 작성 &amp; 결제</h1>
      <p class="text-xs text-slate-600 mt-1">배송지 정보 및 결제 수단을 확인하고 주문을 완료해 주세요.</p>
    </div>

    <!-- 주문 완료 화면 (초기엔 숨김) -->
    <div id="order-complete-box" class="hidden bg-white rounded-xl shadow-md border-2 border-emerald-500 p-8 text-center space-y-4">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto font-black">
        ✔
      </div>
      <h2 class="text-xl font-bold text-slate-900">주문이 성공적으로 완료되었습니다!</h2>
      <p class="text-xs text-slate-600">안전용품이 신속하고 안전하게 배송될 수 있도록 준비하겠습니다.</p>

      <div class="bg-slate-50 p-4 rounded-lg text-xs text-left max-w-md mx-auto space-y-2 border border-slate-200">
        <div class="flex justify-between">
          <span class="text-slate-500">주문 번호:</span>
          <span id="complete-order-num" class="font-mono font-bold text-blue-700"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">받는 분 / 연락처:</span>
          <span id="complete-buyer-info" class="font-semibold text-slate-800"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">배송지:</span>
          <span id="complete-address" class="font-medium text-slate-800"></span>
        </div>
        <div class="flex justify-between pt-2 border-t border-slate-200">
          <span class="text-slate-700 font-bold">최종 결제 금액:</span>
          <span id="complete-total-amount" class="text-base font-black text-blue-700"></span>
        </div>
      </div>

      <div class="pt-4 flex justify-center gap-3">
        <a href="/shop.html" class="btn-safety-yellow px-5 py-2.5 rounded-lg text-xs font-bold">
          안전몰로 돌아가기
        </a>
        <a href="/index.html" class="btn-safety-black px-5 py-2.5 rounded-lg text-xs font-bold">
          메인 홈으로 이동
        </a>
      </div>
    </div>

    <!-- 주문 작성 폼 -->
    <div id="checkout-form-container" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      
      <!-- 좌측: 주문자 및 배송 정보 입력 -->
      <div class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200 space-y-6">
        <form id="checkout-form" onsubmit="handlePlaceOrder(event)" class="space-y-5">
          
          <div>
            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2 mb-3 flex items-center gap-2">
              <span class="text-blue-600">01</span> 주문자 정보
            </h3>
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">성명 / 회사명</label>
                <input type="text" id="buyer-name" required placeholder="홍길동" class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">휴대폰 번호</label>
                  <input type="tel" id="buyer-phone" required placeholder="xxx-xxxx-xxxx" class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">이메일 (영수증 발송용)</label>
                  <input type="email" id="buyer-email" required placeholder="safety@example.com" class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
                </div>
              </div>
            </div>
          </div>

          <div>
            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2 mb-3 flex items-center gap-2">
              <span class="text-blue-600">02</span> 배송지 정보
            </h3>
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">배송 주소</label>
                <input type="text" id="shipping-address" required placeholder="서울특별시 강남구 테헤란로 152 3층 현장사무소" class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">배송 요청사항 (선택)</label>
                <input type="text" id="shipping-memo" placeholder="부재 시 경비실 또는 문 앞에 놓아주세요." class="w-full text-xs p-2.5 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500">
              </div>
            </div>
          </div>

          <div>
            <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2 mb-3 flex items-center gap-2">
              <span class="text-blue-600">03</span> 결제 방식 선택
            </h3>
            <div class="grid grid-cols-3 gap-2 text-xs">
              <label class="border border-slate-300 rounded-lg p-3 text-center cursor-pointer hover:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500">
                <input type="radio" name="payment-method" value="신용카드" checked class="text-blue-600">
                <span class="font-bold block mt-1 text-slate-800">신용카드</span>
              </label>
              <label class="border border-slate-300 rounded-lg p-3 text-center cursor-pointer hover:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500">
                <input type="radio" name="payment-method" value="가상계좌" class="text-blue-600">
                <span class="font-bold block mt-1 text-slate-800">가상계좌</span>
              </label>
              <label class="border border-slate-300 rounded-lg p-3 text-center cursor-pointer hover:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500">
                <input type="radio" name="payment-method" value="무통장입금" class="text-blue-600">
                <span class="font-bold block mt-1 text-slate-800">무통장입금</span>
              </label>
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100">
            <button type="submit" class="w-full btn-safety-yellow py-3.5 rounded-lg text-sm font-black shadow-md flex items-center justify-center gap-2">
              <span>💳</span> 결제 및 주문 확정하기
            </button>
          </div>
        </form>
      </div>

      <!-- 우측: 주문 상품 요약 및 결제 금액 -->
      <div class="lg:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <h3 class="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2 flex items-center justify-between">
          <span>주문 상품 목록</span>
          <a href="/shop.html" class="text-xs text-blue-600 hover:underline">수정하기</a>
        </h3>

        <div id="checkout-items-list" class="space-y-3 divide-y divide-slate-100 max-h-80 overflow-y-auto">
          <!-- 동적 로드 -->
        </div>

        <div class="pt-4 border-t border-slate-200 space-y-2 text-xs">
          <div class="flex justify-between text-slate-600">
            <span>상품 총액:</span>
            <span id="order-subtotal">xxx,xxx</span>
          </div>
          <div class="flex justify-between text-slate-600">
            <span>배송비:</span>
            <span class="text-emerald-700 font-bold">무료 (BEPMC 안전 프로모션)</span>
          </div>
          <div class="flex justify-between text-sm font-black text-slate-900 pt-2 border-t border-slate-200">
            <span>최종 결제 금액:</span>
            <span id="order-final-total" class="text-lg text-blue-700">xxx,xxx</span>
          </div>
        </div>
      </div>

    </div>

  </main>

  <div id="global-footer"></div>

  <script src="/js/common.js"></script>
  <script>
    let cartItems = [];
    let grandTotal = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      await initLayout('shop');
      cartItems = getCart();

      if (cartItems.length === 0) {
        alert('장바구니에 담긴 상품이 없습니다. 안전용품몰로 이동합니다.');
        location.href = '/shop.html';
        return;
      }

      // 로그인된 사용자 정보 자동 입력
      if (currentAuth.isLoggedIn && currentAuth.user) {
        document.getElementById('buyer-name').value = currentAuth.user.name || '';
        document.getElementById('buyer-email').value = currentAuth.user.email || '';
      }

      renderOrderSummary();
    });

    function renderOrderSummary() {
      const container = document.getElementById('checkout-items-list');
      grandTotal = 0;

      container.innerHTML = cartItems.map(item => {
        const itemTotal = item.price * item.quantity;
        grandTotal += itemTotal;
        return `
          <div class="pt-2.5 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 truncate">
              <span class="text-xl">${item.icon || '🛡️'}</span>
              <div class="truncate">
                <span class="font-bold text-slate-800 block truncate">${escapeHtml(item.name)}</span>
                <span class="text-[11px] text-slate-500">xxx,xxx × ${item.quantity}개</span>
              </div>
            </div>
            <span class="font-bold text-slate-900 whitespace-nowrap ml-2">xxx,xxx</span>
          </div>
        `;
      }).join('');

      document.getElementById('order-subtotal').textContent = 'xxx,xxx';
      document.getElementById('order-final-total').textContent = 'xxx,xxx';
    }

    async function handlePlaceOrder(e) {
      e.preventDefault();
      const buyerName = document.getElementById('buyer-name').value.trim();
      const buyerPhone = document.getElementById('buyer-phone').value.trim();
      const buyerEmail = document.getElementById('buyer-email').value.trim();
      const shippingAddress = document.getElementById('shipping-address').value.trim();
      const shippingMemo = document.getElementById('shipping-memo').value.trim();
      const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;

      const fullAddress = shippingMemo ? `${shippingAddress} (${shippingMemo})` : shippingAddress;

      const orderPayload = {
        buyerName,
        buyerPhone,
        buyerEmail,
        shippingAddress: fullAddress,
        items: cartItems.map(i => ({
          productId: i.id,
          name: i.name,
          price: i.price,
          quantity: i.quantity
        })),
        totalAmount: grandTotal,
        paymentMethod
      };

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload)
        });
        const result = await res.json();

        if (result.success && result.order) {
          clearCart(); // 장바구니 비우기
          showOrderComplete(result.order);
        } else {
          alert(result.message || '주문 처리에 실패했습니다.');
        }
      } catch (err) {
        alert('주문 처리 중 오류가 발생했습니다: ' + err.message);
      }
    }

    function showOrderComplete(order) {
      document.getElementById('checkout-form-container').classList.add('hidden');
      const completeBox = document.getElementById('order-complete-box');
      completeBox.classList.remove('hidden');

      document.getElementById('complete-order-num').textContent = order.orderNumber;
      document.getElementById('complete-buyer-info').textContent = `${order.buyerName} (${order.buyerPhone})`;
      document.getElementById('complete-address').textContent = order.shippingAddress;
      document.getElementById('complete-total-amount').textContent = `xxx,xxx (${order.paymentMethod})`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
