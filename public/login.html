<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | BEPMC (Project Management Consultancy)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

  <div id="global-alert-banner"></div>
  <div id="global-header"></div>

  <main class="max-w-md mx-auto px-4 py-16 w-full flex-1 flex flex-col justify-center">

    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <!-- 헤더 (믿음직한 딥 블루) -->
      <div class="bg-[#0f172a] p-6 text-center text-white border-b-2 border-blue-600">
        <div class="h-10 px-4 rounded-xl bg-blue-700 inline-flex items-center justify-center font-black text-white text-lg mx-auto mb-2 border border-blue-500 shadow-inner">
          BE<span class="text-amber-300">PMC</span>
        </div>
        <h1 class="text-lg font-bold">BEPMC 포털 로그인</h1>
        <p class="text-xs text-slate-400 mt-1">회원 및 관리자 통합 로그인</p>
      </div>

      <!-- 로그인 폼 -->
      <form onsubmit="handleLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">아이디</label>
          <input type="text" id="username" required placeholder="아이디 입력" autocomplete="username" class="w-full text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">비밀번호</label>
          <input type="password" id="password" required placeholder="비밀번호 입력" autocomplete="current-password" class="w-full text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full btn-safety-black py-3 rounded-lg text-xs font-bold tracking-wide shadow-sm hover:bg-blue-800 transition">
          로그인
        </button>

        <div class="pt-3 text-center border-t border-slate-100 flex items-center justify-between text-xs">
          <span class="text-slate-500">계정이 없으신가요?</span>
          <a href="/register.html" class="text-blue-700 font-bold hover:underline">회원가입 신청하기 &rarr;</a>
        </div>
      </form>
    </div>

  </main>

  <div id="global-footer"></div>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initLayout();

      if (currentAuth.isLoggedIn) {
        if (currentAuth.mode === 'admin') {
          location.href = '/admin.html';
        } else {
          location.href = '/boards.html?type=member';
        }
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await res.json();

        if (result.success) {
          alert(result.message);
          // 관리자 계정으로 로그인한 경우 관리자 대시보드로 자동 이동
          if (result.user.role === 'admin') {
            location.href = '/admin.html';
          } else {
            location.href = '/boards.html?type=member';
          }
        } else {
          alert(result.message || '로그인에 실패했습니다.');
        }
      } catch (err) {
        alert('오류가 발생했습니다: ' + err.message);
      }
    }
  </script>
</body>
</html>
